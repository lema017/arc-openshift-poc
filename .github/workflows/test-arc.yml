name: Test OpenShift ARC

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: arc-runner-set

    steps:
      - name: Runner identity
        shell: bash
        run: |
          echo "Hello from OpenShift ARC"
          hostname
          uname -a
          cat /etc/os-release

      - name: Network to GitHub
        shell: bash
        run: |
          curl -I https://github.com
